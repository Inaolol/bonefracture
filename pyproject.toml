[project]
name = "bone"
version = "0.1.0"
description = "Notebook-first YOLOv8 fracture detection workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.10.0.84",
    "pandas>=3.0.2",
    "roboflow>=1.3.7",
    "scikit-learn>=1.8.0",
    "ultralytics>=8.4.46",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
